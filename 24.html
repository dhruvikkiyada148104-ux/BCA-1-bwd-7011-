<!DOCTYPE html>
<html lang="en">
<head>
    <title>Different Shapes</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .shape {
            display: inline-flex;
            margin: 30px;
        }

        .square {
            width: 100px;
            height: 100px;
            background: rgb(29, 231, 46);
        }

        .rectangle {
            width: 160px;
            height: 100px;
            background: rgb(233, 114, 17);
        }

        .circle {
            width: 100px;
            height: 100px;
            background: rgb(6, 24, 6);
            border-radius: 50%;
        }

        .oval {
            width: 160px;
            height: 100px;
            background: rgb(209, 9, 159);
            border-radius: 50%;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid purple;
        }
    </style>
</head>

<body>

<h1>Different Shapes</h1>

<div class="shape square"></div>

<div class="shape rectangle"></div>

<div class="shape circle"></div>

<div class="shape oval"></div>

<div class="shape triangle"></div>

</body>
</html>
