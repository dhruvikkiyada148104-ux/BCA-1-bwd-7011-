<!DOCTYPE html>
<html>
<head>
<style>
  table {
    border-collapse: collapse;
    width: 300px;
    height: 300px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }
  td {
    border: 1px solid black;
    transition: background-color 0.3s;
  }
</style>
</head>
<body>

<table>
  <tr>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">black</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">green</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">blue</td>
  </tr>
  <tr>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">orange</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">purple</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">yellow</td>
  </tr>
  <tr>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">pink</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">cyan</td>
    <td onmouseover="this.style.backgroundColor=this.innerText" onmouseout="this.style.backgroundColor='transparent'">lime</td>
  </tr>
</table>

</body>
</html>
